[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-lab"
version = "0.1.0a0"
description = "Pipelines reproduzíveis para experimentos com modelos de linguagem."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0.2,<7"]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9"]
train = ["mlx-lm[train]>=0.29,<1"]

[project.scripts]
llm-lab = "llm_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]
